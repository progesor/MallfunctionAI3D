name: AI3D Studio Build Check
on:
  push:
    branches:
      - feat/desktop-studio-foundation
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-studio:
    name: UI tests + Windows Rust check
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: studio
        run: npm install --no-audit --no-fund
      - name: Workflow converter tests
        working-directory: studio
        run: npm run test:adapter
      - name: React/Three.js typecheck and Vite build
        working-directory: studio
        run: npm run build
      - name: Rust / Tauri typecheck
        run: cargo check --manifest-path studio/src-tauri/Cargo.toml
      - name: Rust API production and history tests
        run: cargo test --manifest-path studio/src-tauri/Cargo.toml --lib
