name: AI3D Studio Build Check
# CI consumes Windows runner minutes. Run manually only when explicitly needed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows-studio:
    name: Workflow + UI + Windows Rust check
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        working-directory: studio
        run: npm install --no-audit --no-fund
      - name: Unity FBX Blender worker Python syntax
        run: python -m py_compile blender/export_unity_fbx.py
      - name: Workflow converter tests
        working-directory: studio
        run: npm run test:adapter
      - name: React/Three.js typecheck and Vite build
        working-directory: studio
        run: npm run build
      - name: Rust / Tauri typecheck
        run: cargo check --manifest-path studio/src-tauri/Cargo.toml
      - name: Rust API workflow and history diagnostics tests
        run: cargo test --manifest-path studio/src-tauri/Cargo.toml --lib
      - name: Install headless Chromium for layout tests
        working-directory: studio
        run: npx playwright install chromium
      - name: Real browser layout, focus and panel interaction checks
        working-directory: studio
        run: npm run test:ui
      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ai3d-ui-failure-screenshots
          path: |
            studio/playwright-report
            studio/test-results
          retention-days: 7
